---

# ===========================================================================
# storage_mounts — CIS 1.1 (mgcdrd.infrabase.storage)
# Your VM template may already carry /tmp, /var, /var/tmp, /var/log,
# /var/log/audit and /home as separate mounts; confirm with
# `findmnt -no SOURCE,FSTYPE <path>` before relying on this default.
#
# Entries without lv/src adopt the existing /etc/fstab line and only change
# the options. An entry for a path with no fstab line fails preflight. Hosts
# without those separate mounts get their own override in host_vars/ or
# group_vars/<group>/harden.yml.
#
# noexec is deliberately left off /var per the role's own README note —
# package managers and scripts need execute there.
# ===========================================================================
storage_mounts:
  - { path: /dev/shm, src: tmpfs, fstype: tmpfs, opts: nodev,noexec,nosuid }
  - { path: /tmp, opts: nodev,noexec,nosuid }
  - { path: /var, opts: nodev,nosuid }
  - { path: /var/tmp, opts: nodev,noexec,nosuid }
  - { path: /var/log, opts: nodev,noexec,nosuid }
  - { path: /var/log/audit, opts: nodev,noexec,nosuid }
  - { path: /home, opts: nodev,noexec,nosuid }




# ===========================================================================
# Hardening policy for the harden deployment. Only values that differ from
# the mgcdrd.infrabase role defaults are set; anything not listed uses the
# role default (CIS-aligned for pam, hardened_services, journald, ...).
# Add per-group exceptions in group_vars/<group>/harden.yml.
# ===========================================================================

# Fallback for --limit/--tags runs that skip the play that detects
# container guests (see deployments/harden/site.yml).
harden_container_guest: false

# kernel_modules — CIS 1.1: unused network protocols and filesystems, plus
# USB storage (remove if hosts need USB mass storage).
kernel_modules_blacklist:
  # Unused network protocols
  - dccp
  - sctp
  - rds
  - tipc
  # Uncommon/unneeded filesystems
  - cramfs
  - freevxfs
  - jffs2
  - hfs
  - hfsplus
  - squashfs
  - udf
  # USB storage — remove if hosts need USB mass storage
  - usb-storage

# sysctl — CIS 3.1-3.3. Override net.ipv4.ip_forward for routers/k8s nodes.
sysctl_conf_file: /etc/sysctl.d/99-hardening.conf

sysctl_params:
  # --- IPv4 routing ---
  - { name: net.ipv4.ip_forward,                       value: 0 }
  - { name: net.ipv4.conf.all.send_redirects,           value: 0 }
  - { name: net.ipv4.conf.default.send_redirects,       value: 0 }
  - { name: net.ipv4.conf.all.accept_redirects,         value: 0 }
  - { name: net.ipv4.conf.default.accept_redirects,     value: 0 }
  - { name: net.ipv4.conf.all.secure_redirects,         value: 0 }
  - { name: net.ipv4.conf.default.secure_redirects,     value: 0 }
  - { name: net.ipv4.conf.all.accept_source_route,      value: 0 }
  - { name: net.ipv4.conf.default.accept_source_route,  value: 0 }
  - { name: net.ipv4.conf.all.log_martians,             value: 1 }
  - { name: net.ipv4.conf.default.log_martians,         value: 1 }
  - { name: net.ipv4.conf.all.rp_filter,                value: 1 }
  - { name: net.ipv4.conf.default.rp_filter,            value: 1 }
  - { name: net.ipv4.tcp_syncookies,                    value: 1 }
  - { name: net.ipv4.icmp_echo_ignore_broadcasts,       value: 1 }
  - { name: net.ipv4.icmp_ignore_bogus_error_responses, value: 1 }
  # --- IPv6 ---
  - { name: net.ipv6.conf.all.forwarding,               value: 0 }
  - { name: net.ipv6.conf.all.accept_redirects,         value: 0 }
  - { name: net.ipv6.conf.default.accept_redirects,     value: 0 }
  - { name: net.ipv6.conf.all.accept_source_route,      value: 0 }
  - { name: net.ipv6.conf.default.accept_source_route,  value: 0 }
  - { name: net.ipv6.conf.all.accept_ra,                value: 0 }
  - { name: net.ipv6.conf.default.accept_ra,            value: 0 }
  # --- Process hardening ---
  - { name: kernel.randomize_va_space,                  value: 2 }
  - { name: kernel.dmesg_restrict,                      value: 1 }
  - { name: kernel.perf_event_paranoid,                 value: 3 }
  - { name: kernel.yama.ptrace_scope,                   value: 1 }
  - { name: fs.suid_dumpable,                           value: 0 }

# login_banner — CIS 1.7. Generic pre-auth text, no hostname/OS/version.
login_banner_text: |
  NOTICE: This system is for authorized use only.
  Unauthorized access or use is strictly prohibited and may be subject to
  criminal and civil penalties. All activity on this system is monitored
  and recorded. By continuing, you consent to this monitoring.

# sshd — CIS 5.2. /etc/issue.net is written by login_banner.
sshd_banner: /etc/issue.net
