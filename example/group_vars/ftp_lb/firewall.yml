---
# haproxy + keepalived cluster fronting the vsftp group — see
# deployments/haproxy-lb. Client-facing ports are the shared vsftp_pasv_* range since haproxy
# proxies the same control + passive-data port range through to the backends.

firewall_zones:
  - name: public
    interfaces: []
    allowed_tcp_ports:
      - 22
      - 21
      - "{{ vsftp_pasv_min_port }}-{{ vsftp_pasv_max_port }}"
    allowed_udp_ports: []
    allowed_services: []
