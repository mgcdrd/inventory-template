cert_manager_values:
  crds:
    enabled: true
  config:
    enableGatewayAPI: true
    enableGatewayAPIListenerSet: true
    featureGates:
      ListenerSets: true
  extraArgs:
    - --dns01-recursive-nameservers-only
    - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
  # Expose metrics on port 9402 — ServiceMonitor applied by deployments/monitoring/
  prometheus:
    enabled: true


# ---- NFS provisioner ----
nfs_provisioner_chart_version: "4.0.18"
nfs_deployment_name: "truenas"
nfs_namespace: "nfs-provisioner"
# nfs_server comes from group_vars/all/all.yml (real IP, not FQDN — NFS
# mounts shouldn't depend on DNS being up).
nfs_share_path: "/exports/k8s/provisioner"  # NFS export path
nfs_mountopts:
  - "vers=3"
nfs_storageClass_create: true
nfs_storageClass_name: truenas
nfs_storageClass_defaultClass: true
nfs_storageClass_archiveOnDelete: true
nfs_storageClass_reclaimPolicy: Retain


# ---- Vault (Raft storage) ----
vault_chart_version: "0.32.0"
vault_namespace: vault
vault_replicas: 3

# External hostname (vault_ext_fqdn, set in group_vars/k8s/k8s.yml) — used in
# the vault TLS cert SAN and Gateway ListenerSet/HTTPRoute. cert-manager issues
# a public cert for this name via vault_ext_issuer.
vault_ext_issuer: le-prod
vault_ingress_tls_secret: vault-ingress-tls

# Static NFS PersistentVolumes for Raft data (one per replica).
# Directories must exist on TrueNAS before running this playbook:
#   vault_nfs_path/vault-0, vault_nfs_path/vault-1, ...
vault_data_size: 10Gi
vault_data_storageclass: manual
vault_nfs_server: "{{ nfs_server }}"
vault_nfs_path: "/mnt/storage/k8s/manual/vault"   # NFS path — subdirs vault-0..N must exist
vault_nfs_mountopts:
  - nfsvers=3

# Vault telemetry — unauthenticated Prometheus metrics at /v1/sys/metrics
# ServiceMonitor applied by deployments/monitoring/ after kube-prometheus-stack is deployed.
vault_telemetry_retention: "30s"

# ---- Monitoring ----
# monitoring_namespace must be defined here so Phase 6 (netpol) can reference it.
# The monitoring namespace is created by that deployment — run it before --tags netpol.
monitoring_namespace: monitoring


# ---- RBAC bootstrap ----
# Maps OIDC groups (synced from LDAP via Keycloak) to Kubernetes ClusterRoles.
# Group names must match exactly what Keycloak puts in the 'groups' JWT claim
# (the group-membership mapper with full.path: false returns bare names).
#
# Built-in ClusterRoles: cluster-admin, admin, edit, view
k8s_oidc_group_bindings:
  - group: k8s-admins       # LDAP group → Keycloak lab realm → k8s
    cluster_role: cluster-admin
  - group: k8s-developers
    cluster_role: edit
  - group: k8s-viewers
    cluster_role: view
