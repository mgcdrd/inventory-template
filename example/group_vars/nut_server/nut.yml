---
# USB-attached UPS host (NUT primary/upsd). See the design doc:
# wiki enterpriseServices/Power/UPS_NUT_Monitoring
# Passwords come from Vault at <env>/nut (the responder VM uses the same
# monuser account, see group_vars/nut_client/ups.yml).

nut_server_ups_name: apc
nut_server_ups_desc: "APC Back-UPS 1500"

nut_server_admin_password:   "{{ lookup('community.hashi_vault.vault_kv2_get', vault_kv_env + '/nut', engine_mount_point=vault_kv_infra_mount, url=vault_addr).secret.admin_password }}"
nut_server_monuser_password: "{{ lookup('community.hashi_vault.vault_kv2_get', vault_kv_env + '/nut', engine_mount_point=vault_kv_infra_mount, url=vault_addr).secret.monuser_password }}"
