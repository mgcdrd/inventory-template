---
# Hosts for one environment. Copy this directory per environment (dev, prd,
# ...) and run with `-i <env>/hosts.yml`; everything in it is self-contained.
# Hosts are grouped by service role (what they run), not by deployment. See
# README.md, "Environments".

all:
  children:
    # ---- service groups ----
    foreman:
      hosts:
        foreman.example.com:
    # `building` is no longer defined here — it's populated dynamically by
    # build.foreman.yml (hosts on Foreman's "Build" subnet). See that file
    # and group_vars/building.yml for the SSH ProxyJump wiring.
    misc:
      hosts:
        misc1.example.com:
        misc2.example.com:
        misc3.example.com:
        misc4.example.com:
        misc5.example.com:
        misc6.example.com:
        misc7.example.com:
        misc8.example.com:
    keycloak:
      hosts:
        keycloak1.example.com:
        keycloak2.example.com:
    kc_pgsql:
      hosts:
        db1.example.com:
    dns_nodes:
      children:
        dns_active:
          hosts:
            dns1.example.com:
            dns2.example.com:
        dns_galera_only:
          hosts:
            dns3.example.com:
    # ups-monitor (NUT). nut_server is the UPS-attached host (often
    # non-domain-joined hardware) — note the inline ansible_user/
    # ansible_password example below if this engagement's UPS host needs
    # its own local credentials instead of the shared ansible_user.
    nut_server:
      hosts:
        nut-server.example.com:
          ansible_user: changeme
          ansible_password: "{{ lookup('community.hashi_vault.vault_kv2_get', 'dmz/nut-server/login', engine_mount_point='infra', url=vault_addr).secret.password }}"
          ansible_become_password: "{{ ansible_password }}"
    nut_client:
      hosts:
        nut-client.example.com:
    proxmox_ve:
      hosts:
        proxmox1.example.com:
        proxmox2.example.com:
        proxmox3.example.com:
        proxmox4.example.com:
    syslog:
      hosts:
        syslog.example.com:
    # ipa_primary_host / ipa_replica split so deployments/ipa can target the
    # first server (ipa-server-install) separately from the replicas
    # (ipa-replica-install). ipa1 here matches the ipa_primary var in
    # group_vars/all/all.yml.
    ipa:
      children:
        ipa_primary_host:
          hosts:
            ipa1.example.com:
        ipa_replica:
          hosts:
            ipa2.example.com:
    gitlab:
      hosts:
        gitlab.example.com:
    gitlab_runner:
      hosts:
        gitlab-runner.example.com:
    harbor:
      hosts:
        harbor.example.com:
    vsftp:
      hosts:
        ftp1.example.com:
        ftp2.example.com:
    ftp_lb:
      hosts:
        ftplb1.example.com:
        ftplb2.example.com:
    # Kubernetes: one cluster per environment. k8smasters/k8sworkers are the
    # role groups the playbooks target; k8s carries the cluster-wide vars.
    k8s:
      children:
        k8smasters:
          hosts:
            master1.example.com:
        k8sworkers:
          hosts:
            worker1.example.com:
            worker2.example.com:
    # nginx + keepalived proxy pair (one pair per environment).
    webproxy:
      hosts:
        proxy1.example.com:
        proxy2.example.com:
    # vsftp backends and the haproxy/keepalived pair in front of them share
    # the passive-mode port range and VIP (group_vars/ftp/ftp.yml).
    ftp:
      children:
        vsftp:
        ftp_lb:
    # Infrastructure Keycloak: nodes + PostgreSQL share install-method, DB and
    # TLS settings (group_vars/infra_kc/).
    infra_kc:
      children:
        keycloak:
        kc_pgsql:
