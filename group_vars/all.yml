---
# Environment-wide constants and connection facts for this engagement.
# Apply to every host regardless of which deployment targets it. Replace
# every placeholder below with the customer's real values before use —
# never commit real hostnames/IPs to a repo that might be shared beyond
# this engagement.

domain:         example.com
kerberos_realm: EXAMPLE.COM

# ipa_primary and vault_addr stay FQDNs even though both are core
# infrastructure — see the IP-addressing note below. If ipa_primary feeds
# anything doing Kerberos/LDAPS against it (e.g. ipa-getkeytab), a bare IP
# breaks SPN/cert hostname matching; if vault_addr's hostname carries a TLS
# cert issued for that FQDN (e.g. behind a LoadBalancer), same problem.
ipa_primary:    ipa1.example.com
gitlab_url:     https://gitlab.example.com
vault_addr:     https://vault.example.com

# Vault KV mount and environment path prefix.
# Secrets are looked up as: <vault_kv_infra_mount>/<vault_kv_env>/<secret>
vault_kv_infra_mount: infra
vault_kv_env:         customer

# Automation connection user — same account regardless of which deployment
# is running.
ansible_user: svc-ansible-user

# ---- IP addressing for core infrastructure ----
# Core infra — hosts other things bootstrap through, especially anything
# DNS itself depends on to recover — should be addressed by real IP, not
# FQDN, so a DNS outage doesn't also block reaching the thing that's down.
# Everything else in this inventory can stay on FQDNs. Apply the same
# ansible_host-override pattern to this engagement's dns_nodes/ipa/syslog/
# hypervisor hosts in hosts.yml once real IPs are known — see
# inventory-common's hosts.yml for the pattern.

# Central syslog target, if this engagement has one. Plain TCP, no TLS/
# hostname verification to worry about — use the real IP once known.
rsyslog_remote_host:     syslog.example.com
rsyslog_remote_port:     514
rsyslog_remote_protocol: tcp

# NFS server used by any deployment mounting shared storage from it.
nfs_server: 192.168.1.100
