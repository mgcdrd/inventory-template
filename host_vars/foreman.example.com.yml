---
# foreman.example.com — service-log centralization via
# mgcdrd.infrabase.rsyslog's rsyslog_file_inputs (imfile). Applied whenever
# a hardening deployment runs against this host (rsyslog_remote_host comes
# from group_vars/all.yml, same as every other host).
#
# Paths below are best-effort from standard Foreman/Katello + httpd layouts
# and have not been confirmed against a live box — verify with
# `ls /var/log/foreman* /var/log/candlepin /var/log/pulp*` and adjust before
# relying on this. facility/severity values below must land in matching
# rulesets on the syslog group's host (see host_vars/syslog.example.com.yml)
# — pick a free local0-7 bucket per service, this is just an example split.
rsyslog_file_inputs:
  # httpd (installer-managed Passenger vhost)
  - path: /var/log/httpd/foreman-ssl_error_ssl.log
    tag: httpd_error
    facility: local1
    severity: notice
  - path: /var/log/httpd/foreman-ssl_access_ssl.log
    tag: httpd_access
    facility: local1
    severity: info

  # Foreman/Katello stack — one destination file per tag
  - path: /var/log/foreman/production.log
    tag: foreman
    facility: local4
  - path: /var/log/foreman-proxy/proxy.log
    tag: foreman-proxy
    facility: local4
  - path: /var/log/candlepin/candlepin.log
    tag: candlepin
    facility: local4
  - path: /var/log/pulp/pulpcore-api.log
    tag: pulpcore-api
    facility: local4
    # If pulpcore already logs via journald on this Foreman version (it has
    # moved around across releases), drop this entry — journald's own
    # forward-to-rsyslog path already covers it and this would double-ship.
