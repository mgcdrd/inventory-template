---
# Canonical host inventory for this engagement. Hosts are grouped by service
# role (what they run), not by which deployment touches them — any
# deployment repo (harden, etc.) can target these groups regardless of which
# one first defined them. See group_vars/<group>.yml for the ports/services
# each group carries, and README.md for the full consumption model.
#
# Mirrors inventory-common's real structure exactly (same groups, same host
# counts) so starting a new engagement is a find-and-replace on values, not
# a guess at what groups/nesting to add. Add or remove groups/hosts here to
# match this engagement's actual topology — the count below isn't a
# requirement, just what the lab currently has.

all:
  children:
    foreman:
      hosts:
        foreman.example.com:
    # `building` is no longer defined here — it's populated dynamically by
    # build.foreman.yml (hosts on Foreman's "Build" subnet). See that file
    # and group_vars/building.yml for the SSH ProxyJump wiring.
    misc:
      hosts:
        misc1.example.com:
        misc2.example.com:
        misc3.example.com:
        misc4.example.com:
        misc5.example.com:
        misc6.example.com:
        misc7.example.com:
        misc8.example.com:
    # k8s hosts live in instances/k8s/<name>/hosts.yml, one directory per
    # cluster — see README.md, "Multiple instances".
    keycloak:
      hosts:
        keycloak1.example.com:
        keycloak2.example.com:
    kc_pgsql:
      hosts:
        db1.example.com:
    dns_nodes:
      children:
        dns_active:
          hosts:
            dns1.example.com:
            dns2.example.com:
        dns_galera_only:
          hosts:
            dns3.example.com:
    # ups-monitor (NUT). nut_server is the UPS-attached host (often
    # non-domain-joined hardware) — note the inline ansible_user/
    # ansible_password example below if this engagement's UPS host needs
    # its own local credentials instead of the shared ansible_user.
    nut_server:
      hosts:
        nut-server.example.com:
          ansible_user: changeme
          ansible_password: "{{ lookup('community.hashi_vault.vault_kv2_get', 'dmz/nut-server/login', engine_mount_point='infra', url=vault_addr).secret.password }}"
          ansible_become_password: "{{ ansible_password }}"
    nut_client:
      hosts:
        nut-client.example.com:
    proxmox_ve:
      hosts:
        proxmox1.example.com:
        proxmox2.example.com:
        proxmox3.example.com:
        proxmox4.example.com:
    syslog:
      hosts:
        syslog.example.com:
    # ipa_primary_host / ipa_replica split so deployments/ipa can target the
    # first server (ipa-server-install) separately from the replicas
    # (ipa-replica-install). ipa1 here matches the ipa_primary var in
    # group_vars/all.yml.
    ipa:
      children:
        ipa_primary_host:
          hosts:
            ipa1.example.com:
        ipa_replica:
          hosts:
            ipa2.example.com:
    gitlab:
      hosts:
        gitlab.example.com:
    gitlab_runner:
      hosts:
        gitlab-runner.example.com:
    harbor:
      hosts:
        harbor.example.com:
    webproxy:
      hosts:
        proxy1.example.com:
        proxy2.example.com:
    vsftp:
      hosts:
        ftp1.example.com:
        ftp2.example.com:
    ftp_lb:
      hosts:
        ftplb1.example.com:
        ftplb2.example.com:
