---
# Canonical host inventory for this engagement. Hosts are grouped by service
# role (what they run), not by which deployment touches them — any
# deployment repo (harden, etc.) can target these groups regardless of which
# one first defined them. See group_vars/<group>.yml for the ports/services
# each group carries, and README.md for the full consumption model.
#
# Mirrors inventory-common's real structure exactly (same groups, same host
# counts) so starting a new engagement is a find-and-replace on values, not
# a guess at what groups/nesting to add. Add or remove groups/hosts here to
# match this engagement's actual topology — the count below isn't a
# requirement, just what the lab currently has.

all:
  children:
    foreman:
      hosts:
        foreman.example.com:
    misc:
      hosts:
        misc1.example.com:
        misc2.example.com:
        misc3.example.com:
        misc4.example.com:
        misc5.example.com:
        misc6.example.com:
        misc7.example.com:
        misc8.example.com:
    k8s:
      children:
        k8smasters:
          hosts:
            master1.example.com:
        k8sworkers:
          hosts:
            worker1.example.com:
            worker2.example.com:
            worker3.example.com:
            worker4.example.com:
    keycloak:
      hosts:
        keycloak1.example.com:
        keycloak2.example.com:
    kcsql:
      hosts:
        db1.example.com:
