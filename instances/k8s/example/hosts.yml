---
# k8s cluster "example". One instance directory per cluster — load exactly
# one per run (see ../../../README.md, "Multiple instances"). Copy this
# directory to instances/k8s/<name>/ for each additional cluster and rename
# k8s_example to k8s_<name> here and in group_vars/.
#
# Every node is listed twice on purpose: once in the k8s_<name> group (carries
# instance_name and the cluster's vars), once in its role group (what the
# playbooks target). Group names use underscores (Ansible warns on hyphens).

all:
  children:
    k8s:
      children:
        k8s_example:
          hosts:
            master1.example.com:
            worker1.example.com:
            worker2.example.com:
            worker3.example.com:
            worker4.example.com:
        k8smasters:
          hosts:
            master1.example.com:
        k8sworkers:
          hosts:
            worker1.example.com:
            worker2.example.com:
            worker3.example.com:
            worker4.example.com:
