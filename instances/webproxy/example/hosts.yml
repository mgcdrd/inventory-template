---
# webproxy cluster "example". One instance directory per cluster — load exactly
# one per run (see ../../../README.md, "Multiple instances"). Copy this
# directory to instances/webproxy/<name>/ for each additional cluster and
# rename webproxy_example to webproxy_<name> here and in group_vars/.
#
# Every node is listed twice on purpose: once in the webproxy_<instance>
# group (carries instance_name and the cluster-specific vars), once in
# webproxy, the shared role group the playbooks target. Group names use
# underscores (Ansible warns on hyphens).

all:
  children:
    webproxy_example:
      hosts:
        proxy1.example.com:
        proxy2.example.com:
    webproxy:
      hosts:
        proxy1.example.com:
        proxy2.example.com:
